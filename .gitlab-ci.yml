stages:
  - analyze
  - build
  - release

# Flutter 3.47.2 (Dart 3.13.2) — meme version que l'environnement de dev.
variables:
  FLUTTER_URL: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz"

.setup_flutter: &setup_flutter
  before_script:
    - apt-get update -yqq && apt-get install -yqq curl xz-utils git
    # Le SDK Flutter est un depot git : eviter l'erreur "dubious ownership"
    - git config --global --add safe.directory '*'
    - curl -L -o /tmp/flutter.tar.xz "$FLUTTER_URL"
    - tar -xf /tmp/flutter.tar.xz -C /opt
    - export PATH="$PATH:/opt/flutter/bin"
    - flutter --version
    - flutter pub get

analyze:
  stage: analyze
  image: ubuntu:22.04
  <<: *setup_flutter
  script:
    - flutter analyze

build_android:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -yqq && apt-get install -yqq curl xz-utils git unzip openjdk-17-jdk
    - git config --global --add safe.directory '*'
    - curl -L -o /tmp/flutter.tar.xz "$FLUTTER_URL"
    - tar -xf /tmp/flutter.tar.xz -C /opt
    - export PATH="$PATH:/opt/flutter/bin"
    - flutter --version
    - flutter pub get
    # Android SDK (requis pour flutter build apk)
    - export ANDROID_HOME=/opt/android-sdk
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - curl -L -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    - yes | sdkmanager --licenses || true
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
  script:
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week

build_web:
  stage: build
  image: ubuntu:22.04
  <<: *setup_flutter
  script:
    - flutter build web --release
  artifacts:
    paths:
      - build/web
    expire_in: 1 week

build_linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -yqq && apt-get install -yqq curl xz-utils git clang cmake ninja-build libgtk-3-dev
    - git config --global --add safe.directory '*'
    - curl -L -o /tmp/flutter.tar.xz "$FLUTTER_URL"
    - tar -xf /tmp/flutter.tar.xz -C /opt
    - export PATH="$PATH:/opt/flutter/bin"
    - flutter --version
    - flutter pub get
  script:
    - flutter build linux --release
  artifacts:
    paths:
      - build/linux/x64/release/bundle
    expire_in: 1 week

# Release GitLab : attache l'APK Android et le build Web (zippe).
release:
  stage: release
  image: ubuntu:22.04
  needs: [build_android, build_web]
  dependencies:
    - build_android
    - build_web
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -yqq && apt-get install -yqq curl zip
    - zip -r web.zip build/web
  script:
    - |
      TAG="v${CI_PIPELINE_IID}"
      BASE="${CI_PROJECT_URL}"
      curl -sS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X POST "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/releases" \
        --data-urlencode "name=Build ${CI_PIPELINE_IID}" \
        --data-urlencode "tag_name=${TAG}" \
        --data-urlencode "ref=${CI_DEFAULT_BRANCH}" \
        --data-urlencode "description=Release automatique (APK Android + Web)"
      APK_PATH=$(curl -sS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X POST "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/uploads" -F "file=@./build/app/outputs/flutter-apk/app-release.apk" | python3 -c "import sys,json;print(json.load(sys.stdin)['full_path'])")
      WEB_PATH=$(curl -sS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X POST "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/uploads" -F "file=@./web.zip" | python3 -c "import sys,json;print(json.load(sys.stdin)['full_path'])")
      curl -sS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X POST "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/releases/${TAG}/assets/links" \
        --data-urlencode "name=app-release.apk" --data-urlencode "url=${BASE}${APK_PATH}" --data-urlencode "link_type=package"
      curl -sS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -X POST "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/releases/${TAG}/assets/links" \
        --data-urlencode "name=web.zip" --data-urlencode "url=${BASE}${WEB_PATH}" --data-urlencode "link_type=package"
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN
