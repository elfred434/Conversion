stages:
  - analyze
  - build
  - release

# Flutter 3.47.2 (Dart 3.13.2) — meme version que l'environnement de dev.
variables:
  FLUTTER_URL: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz"

.setup_flutter: &setup_flutter
  before_script:
    - apt-get update -yqq && apt-get install -yqq curl xz-utils git
    - curl -L -o /tmp/flutter.tar.xz "$FLUTTER_URL"
    - tar -xf /tmp/flutter.tar.xz -C /opt
    - export PATH="$PATH:/opt/flutter/bin"
    - flutter --version
    - flutter pub get

analyze:
  stage: analyze
  image: ubuntu:22.04
  <<: *setup_flutter
  script:
    - flutter analyze

build_android:
  stage: build
  image: ubuntu:22.04
  <<: *setup_flutter
  script:
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week

build_web:
  stage: build
  image: ubuntu:22.04
  <<: *setup_flutter
  script:
    - flutter build web --release
  artifacts:
    paths:
      - build/web
    expire_in: 1 week

build_linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -yqq && apt-get install -yqq curl xz-utils git clang cmake ninja-build libgtk-3-dev
    - curl -L -o /tmp/flutter.tar.xz "$FLUTTER_URL"
    - tar -xf /tmp/flutter.tar.xz -C /opt
    - export PATH="$PATH:/opt/flutter/bin"
    - flutter --version
    - flutter pub get
  script:
    - flutter build linux --release
  artifacts:
    paths:
      - build/linux/x64/release/bundle
    expire_in: 1 week

# Release GitLab : attache l'APK Android et le build Web (zippe).
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build_android, build_web]
  dependencies:
    - build_android
    - build_web
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -yqq && apt-get install -yqq zip
    - zip -r web.zip build/web
  script:
    - glab release create "v$CI_PIPELINE_IID"
        ./build/app/outputs/flutter-apk/app-release.apk
        ./web.zip
        --title "Build $CI_PIPELINE_IID"
        --notes "Release automatique (APK Android + Web)"
        -R "$CI_PROJECT_PATH"
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN
