name: english_conversation_app
description: A conversational English-learning app built with Flutter (Mobile + Desktop).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.4.9
  # Routing
  go_router: ^13.0.0
  # Networking (LLM streaming)
  http: ^1.1.0
  # Local persistence (user level)
  shared_preferences: ^2.2.2
  # Voice: text-to-speech (read tutor replies) and speech-to-text (voice input)
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  record: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
